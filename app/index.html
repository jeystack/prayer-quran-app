<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prayer & Qur'an App</title>
  </head>
  <body>
    <header>
      <h1>Prayer & Qur'an App</h1>
    </header>

    <main>
      <section id="prayer-times">
        <h2>Prayer Times</h2>
        <p class="location">📍 Haltern am See</p>

        <div class="prayer-list">
          <div class="prayer-item">
            <span class="prayer-name">Fajr</span>
            <span class="prayer-time">--:--</span>
          </div>
          <div class="prayer-item">
            <span class="prayer-name">Dhuhr</span>
            <span class="prayer-time">--:--</span>
          </div>
          <div class="prayer-item">
            <span class="prayer-name">Asr</span>
            <span class="prayer-time">--:--</span>
          </div>
          <div class="prayer-item">
            <span class="prayer-name">Maghrib</span>
            <span class="prayer-time">--:--</span>
          </div>
          <div class="prayer-item">
            <span class="prayer-name">Isha</span>
            <span class="prayer-time">--:--</span>
          </div>
        </div>
      </section>

      <section id="daily-checklist">
        <h2>Daily Checklist</h2>
        <p>Checkboxes will go here.</p>
      </section>

      <section id="quran-reader">
        <h2>Qur'an Reader</h2>
        <p>Surah list will go here.</p>
      </section>
    </main>
  </body>
</html>
